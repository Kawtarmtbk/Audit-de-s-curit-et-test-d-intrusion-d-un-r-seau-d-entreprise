global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'kali_dmz'
    static_configs:
      - targets: ['192.168.50.128:9100']

  - job_name: 'kali_attacker'
    static_configs:
      - targets: ['192.168.10.50:9100']

  - job_name: 'windows_client'
    static_configs:
      - targets: ['192.168.145.20:9182']

  - job_name: 'windows_dc'
    static_configs:
      - targets: ['192.168.145.10:9182']
